    - name: rsi_14
      indicator: rsi
      direction: +
      fields:
      - yield
      params:
        window: 14
    volatility:
    - name: level_rv_ratio_20
      indicator: level_rv_ratio
      direction: +
      fields:
      - yield
      params:
        window: 20
