    - name: inflation_momentum
      indicator: yoy_momentum
      direction: '-'
      fields:
      - cpi
      params:
        months: 3
    - name: policy_direction
      indicator: diff_months
      direction: '-'
      fields:
      - policy_rate
      params:
        months: 6
    - name: financial_conditions
      indicator: diff_months
      direction: +
      fields:
      - nfci
      params:
        months: 3
