asset_class: rates
blocks:
  oversold:
    price:
    - name: yield_chg_z_20
      indicator: change_z
      direction: +
      fields:
      - yield
      params:
        window: 20
    - name: yield_chg_z_60
      indicator: change_z
      direction: +
      fields:
      - yield
      params:
        window: 60
    - name: yield_disparity_60
      indicator: level_disparity
      direction: +
      fields:
      - yield
      params:
        window: 60
    confluence:
