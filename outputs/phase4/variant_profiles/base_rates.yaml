    - name: futures_net_spec
      indicator: positioning_z
      direction: '-'
      fields:
      - cot_net
  valuation:
    level:
    - name: real_yield
      indicator: level
      direction: +
      fields:
      - real_yield
    - name: spread_to_policy
      indicator: spread
      direction: +
      fields:
      - yield
      - policy_rate
