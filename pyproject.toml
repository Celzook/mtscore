[project]
name = "mtscore"
version = "0.0.1"
description = "자산 독립적 멀티에셋 마켓타이밍 스코어링 엔진"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
krx = ["pykrx", "finance-datareader", "requests"]
report = ["openpyxl", "plotly"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
