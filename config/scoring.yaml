# 스코어링 공통 설정 (프롬프트 §6 기본값)
percentile:
  method: expanding        # 비교용 rolling
  min_history_years: 3
  rolling_years: 10
missing:
  daily_ffill_max_bdays: 5
  lowfreq_threshold_days: 5          # 그 관측까지 기준일 간격 중앙값이 5일(달력일) 초과면 저빈도: 다음 공표 전까지 유지
  lowfreq_max_hold_bdays: 70         # 저빈도라도 70 자산 달력일(약 3.3개월) 안에 다음 공표가 없으면 결측(중단 시리즈 방지)
# 가중치: 하위블록 동일가중 → 하위블록 내 지표 동일가중이 기본. 자산별 override 는 universe.yaml overrides.weights
# 하위블록 집계: 적지 않은 하위블록은 mean(지표 가중평균). min = 행별 최솟값(퍼지 AND, 지표 가중치 무시,
#   점수가 나오기 시작한 지표가 하나라도 그날 결측이면 하위블록 결측, 워밍업 중인 지표는 빼고 본다). 사용자 결정(2026-10-28): 볼린저 하단 근접과 과매도를 동시에 판정
sub_block_agg:
  oversold.confluence: min
bands:
  extreme: 90
  alert: 75
  contra_alert: 25
  contra_extreme: 10
regime:
  threshold: 50
  partial_label: 부분판정   # N/A 블록이 있을 때 regime.display 에 덧붙는 표기
  matrix:   # (oversold, valuation, fundamental) → label, null = 무관
    - {o: high, v: high, f: high, label: 최우선 매수}
    - {o: high, v: high, f: low, label: 저평가 패닉 분할 진입}
    - {o: high, v: low, f: high, label: 단기 반등 트레이드}
    - {o: high, v: low, f: low, label: 가치함정 경계}
    - {o: low, v: high, f: high, label: 보유 분할 매수}
    - {o: low, v: null, f: low, label: 고점 경계}
    - {o: low, v: low, f: null, label: 비중 축소}
currency_variant: both     # oversold_only | fundamental_only | both — Phase 3 비교 후 확정
confirm_trigger: {enabled: false}   # 미구현 — 사용자 결정(2026-10-26): 나중에. 엔진은 이 키를 읽지 않는다
backtest:
  horizons: [21, 63, 126, 252]
  event_cooldown_bdays: 20
  min_n_warning: 10
