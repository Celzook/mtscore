# 유니버스 (Phase 0 결정 반영). 소스 매핑은 Phase 2 어댑터에서 확정. 미결 사항은 question 키에 적는다.
# 키
#   asset_id · name · asset_class · currency · return_field
#   refs: {이 자산에서 쓸 field: 다른자산ID.field}  — 다른 자산의 PIT 시계열을 그대로 빌려 쓴다(변환 전 원값)
#         policy_rate 는 추세 표시(scoring.yaml trend)의 현금 금리용이다(점수 미사용, 2026-10-29)
#   field_transforms: {field: reciprocal | negate}  — 이 자산 계산 직전에 적용
#   trend: {cash: none, basis: <라벨>}  — 추세 표시(scoring.yaml trend)에서 현금을 빼지 않는다(수익 지수가 이미 초과수익 근사인 자산).
#         basis 는 결과 trend.basis 로 나가는 부호의 기준 라벨(필수). 생략하면 현금을 빼고 기준은 "현금 대비"(2026-10-29 결정 4)
#         return: {yield_field, duration_field | duration} (선택, cash: none 일 때만) — 추세 표시에서만 수익 지수를 스프레드(%p) 필드의
#         −D×Δs/100 + s/100/252 (국채 대비 초과수익 근사)로 바꾼다. D 는 패널 필드 duration_field 의 직전 관측일 값(시변) 또는 상수 duration(가정).
#         return_field·백테스트·점수는 그대로(P5-3, 2026-10-29). 켜려면 패널에 duration_field 가 있어야 한다(outputs/phase5/p5_3_adopt.patch)
#   overrides: {exclude: [지표명 | 블록 | 하위블록 | 블록.하위블록], weights: {지표명 | 블록.하위블록: w}, params: {지표명: {...}}}
#   그 밖의 키는 meta 로 보존(엔진 계산에 쓰지 않음)
- asset_id: KOSPI200
  name: 코스피200
  asset_class: equity_index
  currency: KRW
  return_field: close_tr          # .KS200TR(2011~), 이전 구간은 가격지수
  constituents: KOSPI200          # 현재 구성종목(KODEX200 069500.KS 보유종목) 바텀업 — 생존편향(가정, 사용자 결정 2026-10-28). KRX 로그인 생기면 과거 구성종목으로
  refs: {local_10y: KTB10Y.yield, fx_home: USDKRW.close, policy_rate: KTB10Y.policy_rate}
  overrides: {}
- asset_id: SP500
  name: S&P500
  asset_class: equity_index
  currency: USD
  return_field: close
  refs: {local_10y: UST10Y.yield, policy_rate: UST10Y.policy_rate}
  overrides:
    exclude: [flows, breadth, pbr_trailing, dividend_yield, home_ccy_shock_20, home_ccy_trend_3m]   # PBR·배당 불가(R2), 자국통화 지표 해당 없음
- asset_id: KTB10Y
  name: 국고채 10년
  asset_class: rates
  currency: KRW
  return_field: duration_approx   # −D×Δy + carry, 가정
  duration: 8.5                   # 가정: 10년 국고 수정듀레이션 근사, Phase 2 에서 확인
  overrides: {exclude: [futures_net_spec, term_premium, financial_conditions]}   # KTB 포지셔닝·한국 기간프리미엄 미확인, NFCI 는 미국 지표
- asset_id: UST10Y
  name: 미국채 10년
  asset_class: rates
  currency: USD
  return_field: duration_approx
  duration: 8.5
  overrides: {}
- asset_id: USDKRW
  name: 달러/원 (원화 매수 관점)
  asset_class: fx
  currency: KRW
  quote_view: buy_quote           # 원화 매수 관점: USDKRW 상승 = 원화 과매도
  return_field: close             # 변환 후(원화 가격) 기준
  field_transforms: {close: reciprocal}
  refs: {policy_rate: KTB10Y.policy_rate}   # 추세 표시 현금 금리(점수 미사용)
  overrides: {exclude: [spec_positioning]}   # CFTC KRW 계약 검색 0건(F3)
- asset_id: GOLD
  name: 금
  asset_class: commodity
  currency: USD
  return_field: close             # 활성월(G J M Q V Z) 비율 백어저스트 연속물(사용자 결정 2026-10-28 B)
  refs: {real_yield_us: UST10Y.real_yield, policy_rate: UST10Y.policy_rate}
  overrides:
    # 재고는 WTI 전용, 금 커브는 금리 캐리만 반영(사용자 결정 2026-10-26).
    # close 는 활성월 비율 백어저스트 연속물이라 실질가격은 원 근월물(close_c1_raw)로 본다(사용자 결정 2026-10-28 B)
    exclude: [inventory_change, backwardation, real_price_level]
    add:
      valuation.real_price:
        - {name: real_price_level_spot, indicator: ratio, direction: -, fields: [close_c1_raw, cpi]}
      fundamental.real_rate:
        - {name: real_rate_change, indicator: diff_months, direction: -, fields: [real_yield_us], params: {months: 3}}   # 실질금리 하락 = 금 우호
- asset_id: WTI
  name: WTI 원유
  asset_class: commodity
  currency: USD
  return_field: close             # 비율 백어저스트 연속물(롤 수익 포함, 사용자 결정 2026-10-28). 근월물 교체 5영업일 전 교체(가정)
  refs: {policy_rate: UST10Y.policy_rate}   # 추세 표시 현금 금리(점수 미사용)
  overrides:
    # close 는 백어저스트 연속물이라 수준(실질가격)과 커브(c1/c2) 비교에는 맞지 않는다 → 원 근월물 가격(close_c1_raw)으로 바꾼다
    exclude: [real_price_level, backwardation]
    add:
      valuation.real_price:
        - {name: real_price_level_spot, indicator: ratio, direction: -, fields: [close_c1_raw, cpi]}
      fundamental.curve:
        - {name: backwardation_spot, indicator: ratio_minus_one, direction: +, fields: [close_c1_raw, close_c2]}
- asset_id: US_HY
  name: 미국 하이일드
  asset_class: credit
  currency: USD
  return_field: index_level       # iBoxx USD Liquid HY(.IBLUS0004) TRDPRC_1 = 총수익지수(TRTN_PRICE 와 동일, Phase 2 확인)
  spread_source: iboxx_gspread    # YLDTOMAT − 동일 듀레이션 UST 보간. 2023-10~ FRED ICE OAS 와 대조
  ric: .IBLUS0004
  refs: {equity_fwd_eps: SP500.fwd_eps_12m, spread_low_grade: US_HY.spread, spread_high_grade: US_IG.spread, policy_rate: UST10Y.policy_rate}
  trend: {cash: none, basis: 국채 대비, return: {yield_field: spread, duration_field: mod_durtn}}   # P5-3: 추세는 스프레드 −D×Δs + s 캐리(국채 대비 초과수익 근사, D = iBoxx MOD_DURTN). 점수·국면·백테스트 수익률 불변
  overrides: {}
- asset_id: US_IG
  name: 미국 투자등급
  asset_class: credit
  currency: USD
  return_field: index_level       # iBoxx USD Liquid IG(.IBLUS0005) TRDPRC_1 = 총수익지수(TRTN_PRICE 와 동일, Phase 2 확인)
  spread_source: iboxx_gspread
  ric: .IBLUS0005
  refs: {equity_fwd_eps: SP500.fwd_eps_12m, spread_low_grade: US_HY.spread, spread_high_grade: US_IG.spread, policy_rate: UST10Y.policy_rate}
  trend: {cash: none, basis: 국채 대비, return: {yield_field: spread, duration_field: mod_durtn}}   # P5-3: 추세는 스프레드 −D×Δs + s 캐리(국채 대비 초과수익 근사, D = iBoxx MOD_DURTN). 점수·국면·백테스트 수익률 불변
  overrides: {}
- asset_id: KR_CORP
  name: 국내 회사채 AA-(3년) − 국고3년
  asset_class: credit
  currency: KRW
  return_field: duration_approx
  duration: 2.7
  return_yield_field: spread      # 가정: 스프레드(AA−3년 − 국고3년)로 −D×Δs + s 캐리 = 같은 듀레이션 국고 대비 초과수익 근사(총수익 아님)
  trend: {cash: none, basis: 국고 대비}   # 수익 지수가 이미 국고 대비 초과수익 근사라 현금을 또 빼지 않는다(사용자 결정 2026-10-29 결정 4)
  refs: {equity_fwd_eps: KOSPI200.fwd_eps_12m, spread_high_grade: KR_CORP.spread, policy_rate: KTB10Y.policy_rate}   # spread_low_grade(BBB−−국고3년)는 자체 필드(KRCORP=KQ, 2010~ 확인 2026-10-28)
  overrides: {}
