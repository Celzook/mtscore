# fx 프로파일 — 매수 대상 통화 관점의 가격(close)을 입력으로 받는다.
# USDKRW(원화 매수 관점)는 universe.yaml 의 field_transforms: {close: reciprocal} 로 원화 가격(USD/KRW)으로 바꾼 뒤 계산한다.
asset_class: fx
blocks:
  oversold:
    price:
      - {name: disparity_60, indicator: disparity, direction: -, fields: [close], params: {window: 60}}
      - {name: return_z_20, indicator: return_z, direction: -, fields: [close], params: {window: 20}}
    confluence:   # 볼린저 하단 근접 AND 과매도 — scoring.yaml sub_block_agg: min(사용자 결정 2026-10-28) — 효과 미확인(Phase 3 §6-5, Phase 4 B — 2026-10-29 유지 결정)
      - {name: bb_pctb_20, indicator: bb_pctb, direction: -, fields: [close], params: {window: 20, k: 2}}
      - {name: rsi_14, indicator: rsi, direction: -, fields: [close], params: {window: 14}}   # 사용자 결정 2026-10-26(추가) → 2026-10-28 price 에서 confluence 로 옮김
    volatility:
      - {name: rv_ratio_20, indicator: rv_ratio, direction: +, fields: [close], params: {window: 20}}   # 평소보다 높은 변동성 = 기회(사용자 결정 2026-10-28, 가정: 미검증) — 효과 미확인(Phase 3 §6-5, Phase 4 B — 2026-10-29 유지 결정)
    positioning:
      - {name: spec_positioning, indicator: positioning_z, direction: -, fields: [cot_net]}   # KRW: CFTC 계약 검색 0건 → overrides 로 제외
  valuation:
    reer:
      - {name: reer_level, indicator: level, direction: -, fields: [reer]}   # 자기 역사 대비 REER 백분위(높을수록 고평가)
  fundamental:
    macro:
      - {name: rate_diff_chg_3m, indicator: diff_months, direction: +, fields: [rate_diff], params: {months: 3}}   # 매수 통화 금리 − 상대 통화 금리
      - {name: current_account_trend, indicator: diff_months, direction: +, fields: [current_account_12m], params: {months: 3}}   # 12개월 누적(어댑터 공급)
      - {name: terms_of_trade_trend, indicator: pct_change_months, direction: +, fields: [terms_of_trade], params: {months: 3}, status: na_until_found}
