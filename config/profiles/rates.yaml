# rates 프로파일 — 가격 기준: 금리 상승 = 과매도(매수 매력 ↑). yield 단위 %.
asset_class: rates
blocks:
  oversold:
    price:
      - {name: yield_chg_z_20, indicator: change_z, direction: +, fields: [yield], params: {window: 20}}
      - {name: yield_chg_z_60, indicator: change_z, direction: +, fields: [yield], params: {window: 60}}
      - {name: yield_disparity_60, indicator: level_disparity, direction: +, fields: [yield], params: {window: 60}}
    confluence:   # 금리 볼린저 상단 근접 AND 금리 RSI 과열(= 채권 과매도) — scoring.yaml sub_block_agg: min(사용자 결정 2026-10-28) — 효과 미확인(Phase 3 §6-5, Phase 4 B — 2026-10-29 유지 결정)
      - {name: bb_pctb_20, indicator: bb_pctb, direction: +, fields: [yield], params: {window: 20, k: 2}}
      - {name: rsi_14, indicator: rsi, direction: +, fields: [yield], params: {window: 14}}   # 금리 수준의 차분으로 계산(가정: 금리 RSI 를 채권 가격 RSI 의 반대로 읽는다)
    volatility:
      - {name: level_rv_ratio_20, indicator: level_rv_ratio, direction: +, fields: [yield], params: {window: 20}}   # 평소보다 높은 금리 변동성 = 기회(사용자 결정 2026-10-28, 가정: 미검증) — 효과 미확인(Phase 3 §6-5, Phase 4 B — 2026-10-29 유지 결정)
    positioning:
      - {name: futures_net_spec, indicator: positioning_z, direction: -, fields: [cot_net]}   # UST: CFTC / KTB: 미확인 → universe overrides 로 제외
  valuation:
    level:
      - {name: real_yield, indicator: level, direction: +, fields: [real_yield]}       # KR 은 KTB10Y − CPI YoY 대리(가정)
      - {name: spread_to_policy, indicator: spread, direction: +, fields: [yield, policy_rate]}
      - {name: term_premium, indicator: level, direction: +, fields: [term_premium]}   # US: Kim-Wright / KR: 미확인 → overrides 로 제외
  fundamental:
    macro:
      - {name: macro_surprise, indicator: level, direction: -, fields: [macro_surprise], status: na_until_found}
      - {name: inflation_momentum, indicator: yoy_momentum, direction: -, fields: [cpi], params: {months: 3}}   # 물가 둔화 = 채권 우호. CPI as_of = 기준월 + 공표 시차(가정)
      - {name: policy_direction, indicator: diff_months, direction: -, fields: [policy_rate], params: {months: 6}}   # 인하 국면 = 채권 우호(후행 성격)
      - {name: financial_conditions, indicator: diff_months, direction: +, fields: [nfci], params: {months: 3}}   # 여건 긴축 = 채권 우호. 미국만(KTB 는 overrides 로 제외)
