# commodity 프로파일
asset_class: commodity
blocks:
  oversold:
    price:
      - {name: disparity_60, indicator: disparity, direction: -, fields: [close], params: {window: 60}}
      - {name: return_z_20, indicator: return_z, direction: -, fields: [close], params: {window: 20}}
    confluence:   # 볼린저 하단 근접 AND 과매도 — scoring.yaml sub_block_agg: min(사용자 결정 2026-10-28)
      - {name: bb_pctb_20, indicator: bb_pctb, direction: -, fields: [close], params: {window: 20, k: 2}}
      - {name: rsi_14, indicator: rsi, direction: -, fields: [close], params: {window: 14}}
    volatility:
      - {name: rv_ratio_20, indicator: rv_ratio, direction: +, fields: [close], params: {window: 20}}   # 평소보다 높은 변동성 = 기회(사용자 결정 2026-10-28, 가정: 미검증)
    positioning:
      - {name: spec_positioning, indicator: positioning_z, direction: -, fields: [cot_net]}
  valuation:
    real_price:
      - {name: real_price_level, indicator: ratio, direction: -, fields: [close, cpi]}   # 실질가격의 자기 역사 백분위
  fundamental:
    curve:
      - {name: backwardation, indicator: ratio_minus_one, direction: +, fields: [close, close_c2]}
    inventory:
      - {name: inventory_change, indicator: pct_change_months, direction: -, fields: [inventory], params: {months: 1}}   # WTI 전용. 소스: EIA 주간 재고 PS-ESPR-EIA(lseg, 2026-10-28 확인)
