# credit 프로파일 — 스프레드 확대 = 과매도(매수 매력 ↑). spread 단위 %p 또는 bp(자산 안에서 일관되면 됨).
asset_class: credit
blocks:
  oversold:
    spread:
      - {name: spread_chg_z_20, indicator: change_z, direction: +, fields: [spread], params: {window: 20}}
    confluence:   # 스프레드 볼린저 상단 근접 AND 스프레드 RSI 과열(= 크레딧 과매도) — scoring.yaml sub_block_agg: min(사용자 결정 2026-10-28)
      - {name: bb_pctb_20, indicator: bb_pctb, direction: +, fields: [spread], params: {window: 20, k: 2}}
      - {name: rsi_14, indicator: rsi, direction: +, fields: [spread], params: {window: 14}}   # 스프레드 수준의 차분으로 계산(가정: 스프레드 RSI 를 크레딧 가격 RSI 의 반대로 읽는다)
    volatility:
      - {name: level_rv_ratio_20, indicator: level_rv_ratio, direction: +, fields: [spread], params: {window: 20}}   # 평소보다 높은 스프레드 변동성 = 기회(사용자 결정 2026-10-28, 가정: 미검증)
  valuation:
    level:
      - {name: spread_level, indicator: level, direction: +, fields: [spread]}
  fundamental:
    defaults:
      - {name: default_trend, indicator: diff_months, direction: -, fields: [default_rate], params: {months: 3}, status: na_until_found}
    cycle:
      - {name: equity_eps_momentum, indicator: pct_change_months, direction: +, fields: [equity_fwd_eps], params: {months: 3}}   # 같은 지역 주가지수 Fwd EPS(refs) — 기업 펀더멘털 대리(가정)
      - {name: quality_gap_trend, indicator: spread_gap_change, direction: -, fields: [spread_low_grade, spread_high_grade], params: {months: 3}}   # 하위−상위 등급 스프레드 차이 축소 = 사이클 개선
